<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{{SCHOOL}} — Parents</title>
<link rel="manifest" href="/parent/app.webmanifest"><meta name="theme-color" content="#174B60"><link rel="apple-touch-icon" href="/icons/cga-180.png"><link rel="icon" type="image/png" href="/icons/cga-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CGA Parents">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#159670;--green-dark:#0F7657;--tint:#E6F5F0;--navy:#174B60;--navy-2:#1E5E77;--ink:#12313D;--muted:#6B7C85;--line:#E1EAEE;--bg:#EEF3F2;--danger:#C0392B;--accent:#FFCC68;--warn:#FFF6E0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"League Spartan","Segoe UI",Arial,sans-serif;background:#DCE6E4;color:var(--ink);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- login ---------- */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--navy) 0%,#0F3A4B 100%)}
.login form{background:#fff;border-radius:20px;padding:28px 22px 24px;width:100%;max-width:380px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.login .logo{width:76px;height:76px;border-radius:18px;background:#fff;box-shadow:0 4px 14px rgba(23,75,96,.18);display:block;margin:-62px auto 14px;border:4px solid #fff}
.login h1{font-size:1.45rem;font-weight:800;text-align:center}
.login p{color:var(--muted);font-size:.92rem;margin:6px 0 16px;line-height:1.4;text-align:center}
.login label{display:block;font-size:.82rem;font-weight:700;margin:12px 0 6px}
.login input{width:100%;padding:13px 14px;border:1.5px solid #D3DEDE;border-radius:12px;font-size:1.05rem;background:#FAFCFC}
.login input:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 4px rgba(21,150,112,.12)}
.login button{width:100%;margin-top:20px;padding:14px;border:none;border-radius:12px;background:var(--green);color:#fff;font-weight:800;font-size:1.02rem}
.login button:disabled{opacity:.6}
.err{background:#fdecea;color:var(--danger);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-top:12px;display:none}
.help{font-size:.82rem;color:var(--muted);margin-top:14px;line-height:1.4;text-align:center}

/* ---------- app shell ---------- */
.app{display:none;flex-direction:column;height:100%;max-width:760px;margin:0 auto;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.08)}
.top{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:11px}
.top img{width:42px;height:42px;border-radius:12px;background:#fff;flex-shrink:0}
.top .t{min-width:0}
.top b{display:block;font-size:1.02rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{color:#A9CAD6;font-size:.76rem;display:flex;align-items:center;gap:5px}
.top small i{width:7px;height:7px;border-radius:50%;background:#4ADE80;display:inline-block}
.tinst{margin-left:auto;color:#fff;font:inherit;font-size:.8rem;border:none;background:#159670;border-radius:10px;padding:8px 11px;white-space:nowrap;cursor:pointer}
.tinst + a{margin-left:8px!important}
.top a{margin-left:auto;color:#fff;font-size:.8rem;text-decoration:none;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 11px;white-space:nowrap}
.kids{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.kids::-webkit-scrollbar{display:none}
.kid{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px 5px 5px;white-space:nowrap;font-size:.88rem;font-weight:600}
.kid .av{width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--green-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem}
.kid small{color:var(--muted);font-weight:500}
.kid.on{border-color:var(--green);background:var(--tint)}
.kid.on .av{background:var(--green);color:#fff}

/* ---------- messages ---------- */
.msgs{flex:1;overflow-y:auto;padding:16px 12px 10px;display:flex;flex-direction:column;gap:8px;
  background-color:var(--bg);background-image:radial-gradient(rgba(23,75,96,.06) 1px,transparent 1px);background-size:18px 18px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.row.me{justify-content:flex-end}
.row .ava{width:28px;height:28px;border-radius:50%;background:#fff;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.b{max-width:84%;padding:10px 13px 6px;border-radius:16px;line-height:1.42;font-size:.95rem;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(18,49,61,.08);position:relative}
.b.bot{background:#fff;border-bottom-left-radius:5px}
.b.me{background:var(--green);color:#fff;border-bottom-right-radius:5px}
.b.note{background:#E8F7F0;border:1px solid #BFE3D6}
.b.warn{background:var(--warn);border:1px solid #F0D9A0}
.b .tm{display:block;text-align:right;font-size:.68rem;opacity:.6;margin-top:4px}
.b h4{font-size:1rem;margin-bottom:6px;color:var(--navy);font-weight:800}
.b.me h4{color:#fff}
.b p{margin:4px 0}
.b ul{list-style:none;margin:6px 0 2px}
.b li{position:relative;padding:5px 0 5px 16px;border-top:1px dashed var(--line);font-size:.92rem}
.b li:first-child{border-top:none}
.b li::before{content:"";position:absolute;left:2px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.b .kv{display:grid;grid-template-columns:auto 1fr;gap:0;margin:6px 0;font-size:.92rem;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.b .kv span{padding:6px 9px;border-top:1px solid var(--line)}
.b .kv span:nth-child(-n+2){border-top:none}
.b .kv span:nth-child(odd){color:var(--muted);font-weight:700;background:#F6FAF9}
.b img.thumb{display:block;max-width:220px;max-height:220px;border-radius:10px;margin:2px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 4px}
.tiles button{border:1px solid var(--line);background:#F7FBFA;border-radius:12px;padding:10px 8px;text-align:left;font-size:.88rem;font-weight:700;display:flex;align-items:center;gap:8px}
.tiles button span{font-size:1.25rem}
.tiles button:active{background:var(--tint)}
.day{align-self:center;background:rgba(255,255,255,.85);color:var(--muted);font-size:.74rem;padding:4px 10px;border-radius:999px;margin:4px 0}
.typing{display:flex;gap:4px;padding:12px 14px;background:#fff;border-radius:16px;border-bottom-left-radius:5px;width:max-content;box-shadow:0 1px 2px rgba(18,49,61,.08)}
.typing i{width:7px;height:7px;border-radius:50%;background:#9FB3BA;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* ---------- bottom bar ---------- */
.quick{display:flex;gap:7px;padding:8px 12px;overflow-x:auto;background:#fff;border-top:1px solid var(--line);scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{border:1.5px solid #CFE3DC;background:var(--tint);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:.85rem;font-weight:700;white-space:nowrap}
.quick button.hl{background:var(--green);border-color:var(--green);color:#fff}
.compose{display:flex;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#fff;align-items:flex-end}
.compose .box{flex:1;display:flex;align-items:flex-end;background:#F1F5F5;border:1.5px solid transparent;border-radius:24px;padding:3px 4px 3px 6px}
.compose .box:focus-within{border-color:var(--green);background:#fff}
.compose textarea{flex:1;resize:none;border:none;background:transparent;padding:9px 6px;max-height:120px;min-height:40px;font-size:1rem;outline:none}
.icon{border:none;background:transparent;width:40px;height:40px;border-radius:50%;font-size:1.25rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send{border:none;background:var(--green);color:#fff;width:46px;height:46px;border-radius:50%;font-size:1.15rem;flex-shrink:0;box-shadow:0 3px 10px rgba(21,150,112,.35)}
.mode{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--warn);border-top:1px solid #F0D9A0;font-size:.86rem;color:#6b4a00}
.mode button{margin-left:auto;border:1px solid #e0c27a;background:#fff;border-radius:8px;padding:4px 10px}

/* ---------- receipt sheet ---------- */
.sheetBg{position:fixed;inset:0;background:rgba(10,30,38,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheetBg.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .handle{width:44px;height:5px;border-radius:3px;background:#D5DFDF;margin:0 auto 12px}
.sheet h3{font-size:1.15rem;font-weight:800}
.sheet .sub{color:var(--muted);font-size:.86rem;margin:3px 0 12px}
.sheet label.l{display:block;font-size:.8rem;font-weight:700;margin:12px 0 6px}
.sheet input,.sheet select{width:100%;padding:11px 12px;border:1.5px solid #D3DEDE;border-radius:12px;background:#FAFCFC;font-size:1rem}
.sheet input:focus,.sheet select:focus{outline:none;border-color:var(--green);background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ch input{width:auto;accent-color:var(--green)}
.ch b{display:block;font-size:.95rem}
.ch small{color:var(--muted);font-size:.8rem}
.ch .amt{margin-left:auto;font-weight:800;color:var(--danger);white-space:nowrap}
.ch.on{border-color:var(--green);background:var(--tint)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed #BFD6D0;border-radius:14px;padding:18px;background:#F7FBFA;text-align:center;color:var(--muted);font-size:.9rem}
.drop b{color:var(--ink);font-size:1rem}
.drop img{max-width:100%;max-height:220px;border-radius:10px}
.sheet .go{width:100%;margin-top:16px;padding:14px;border:none;border-radius:14px;background:var(--green);color:#fff;font-weight:800;font-size:1.02rem}
.sheet .go:disabled{opacity:.55}
.sheet .x{float:right;border:none;background:#F1F5F5;border-radius:50%;width:34px;height:34px;font-size:1rem}
.sheet .msg{margin-top:10px;font-size:.88rem;color:var(--danger)}
.past{margin-top:16px;border-top:1px solid var(--line);padding-top:10px;font-size:.86rem}
.past div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.st-p{color:#8a6100;font-weight:700}.st-a{color:var(--green-dark);font-weight:700}.st-r{color:var(--danger);font-weight:700}
</style>
</head>
<body>

<div class="login" id="login">
  <form id="loginForm" autocomplete="on">
    <img class="logo" src="/icons/cga-192.png" alt="">
    <h1>Parents App</h1>
    <p>{{SCHOOL}} — your child's attendance, test results, homework, fees and receipts in one place.</p>
    <label for="phone">Phone number (as registered with the school)</label>
    <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="03XX XXXXXXX" required>
    <label for="pin">6-digit PIN (given by the school)</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="\d{6}" maxlength="6" placeholder="••••••" required>
    <button type="submit" id="loginBtn">Login</button>
    <div class="err" id="loginErr"></div>
    <p class="help">Didn't get a PIN or forgot it? Contact the school office — they will give you a new PIN.</p>
  </form>
</div>

<div class="app" id="app">
  <div class="top">
    <img src="/icons/cga-192.png" alt="">
    <div class="t"><b>{{SCHOOL}}</b><small><i></i><span id="topKid">Parents</span></small></div>
    <button type="button" class="tinst" id="tinst" style="display:none" aria-label="Install app">📲 Install</button>
    <a href="/parent/logout" onclick="return confirm('Log out of the Parents App?')">⎋ Logout</a>
  </div>
  <div class="kids" id="kids"></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="mode" id="mode"><span>✉️ This message will go to the school — about <b id="modeKid"></b></span><button type="button" id="modeCancel">Cancel</button></div>
  <div class="quick" id="quick"></div>
  <form class="compose" id="compose">
    <div class="box">
      <button type="button" class="icon" id="attach" title="Send fee receipt" aria-label="Send fee receipt">📎</button>
      <textarea id="text" rows="1" placeholder="Type: attendance, test, fee…" aria-label="Message"></textarea>
    </div>
    <button type="submit" class="send" aria-label="Send">➤</button>
  </form>
</div>

<div class="sheetBg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rcTitle">
    <div class="handle"></div>
    <button type="button" class="x" id="rcClose" aria-label="Close">✕</button>
    <h3 id="rcTitle">🧾 Send fee receipt</h3>
    <p class="sub" id="rcSub"></p>
    <div id="rcFees"></div>
    <div class="g2">
      <div><label class="l" for="rcAmt">Amount paid (Rs)</label><input id="rcAmt" type="number" inputmode="numeric" min="1"></div>
      <div><label class="l" for="rcDate">Date paid</label><input id="rcDate" type="date"></div>
    </div>
    <div class="g2">
      <div><label class="l" for="rcMethod">Method</label><select id="rcMethod"><option>Bank transfer</option><option>JazzCash</option><option>EasyPaisa</option><option>Cash (school)</option><option>Other</option></select></div>
      <div><label class="l" for="rcRef">Transaction ID (agar ho)</label><input id="rcRef" maxlength="60" placeholder="optional"></div>
    </div>
    <label class="l">Receipt photo / screenshot</label>
    <label class="drop" id="rcDrop" for="rcFile"><span style="font-size:1.8rem">📷</span><b>Take a photo or choose a file</b><span>JPG, PNG or PDF</span></label>
    <input type="file" id="rcFile" accept="image/*,application/pdf" style="display:none">
    <div class="msg" id="rcMsg"></div>
    <button type="button" class="go" id="rcGo">Send receipt</button>
    <div class="past" id="rcPast"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let ME = null, KID = null, MODE = "chat", RC = null;
const ICON = {attendance:"📅", tests:"📝", homework:"📚", fee:"💳", receipt:"🧾", remarks:"💬", issue:"✉️"};

async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, credentials:"same-origin", body:JSON.stringify(body)}
                                  : {credentials:"same-origin", cache:"no-store"});
  const j = await r.json().catch(()=>({}));
  if(r.status === 401 && path !== "/parent/login"){ showLogin(); throw new Error("login"); }
  if(!r.ok) throw new Error(j.error || ("Something went wrong (" + r.status + ")"));
  return j;
}
const money = n => "Rs " + Math.round(+n || 0).toLocaleString("en-US");
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtM = m => { if(!m) return ""; const [y, mo] = String(m).split("-"); return `${MONTHS[+mo-1]} ${y}`; };
const fmtD = d => { if(!d) return ""; const [y, m, dd] = String(d).slice(0,10).split("-"); return `${+dd} ${MONTHS[+m-1]} ${y}`; };
const now = () => new Date().toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

/* ---------- bubbles (sirf text — server se koi HTML nahi) ---------- */
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text !== undefined) e.textContent = text; return e; }
function scrollDown(){ const m = $("msgs"); requestAnimationFrame(()=>{ m.scrollTop = m.scrollHeight; }); }
function stamp(b){ b.appendChild(el("span", "tm", now())); }
function say(text, img){
  const row = el("div", "row me"), b = el("div", "b me");
  if(img){ const i = el("img", "thumb"); i.src = img; i.alt = ""; b.appendChild(i); }
  b.appendChild(el("p", "", text)); stamp(b); row.appendChild(b); $("msgs").appendChild(row); scrollDown();
}
function bot(blocks, cls, extra){
  const row = el("div", "row"), av = el("img", "ava"); av.src = "/icons/cga-192.png"; av.alt = "";
  const b = el("div", "b bot" + (cls ? " " + cls : ""));
  (blocks || []).forEach(x=>{
    if(x.t === "h") b.appendChild(el("h4", "", x.text));
    else if(x.t === "p") b.appendChild(el("p", "", x.text));
    else if(x.t === "li"){ const ul = el("ul"); x.items.forEach(i=>ul.appendChild(el("li", "", i))); b.appendChild(ul); }
    else if(x.t === "kv"){ const d = el("div", "kv"); x.rows.forEach(([k,v])=>{ d.appendChild(el("span", "", k)); d.appendChild(el("span", "", v)); }); b.appendChild(d); }
  });
  if(extra) b.appendChild(extra);
  stamp(b); row.appendChild(av); row.appendChild(b); $("msgs").appendChild(row); scrollDown();
}
function typing(on){
  let t = $("typing");
  if(on && !t){ t = el("div", "row"); t.id = "typing"; const d = el("div", "typing"); d.append(el("i"), el("i"), el("i")); t.appendChild(d); $("msgs").appendChild(t); scrollDown(); }
  if(!on && t) t.remove();
}
function tiles(){
  const g = el("div", "tiles");
  ME.menu.forEach(m=>{ const b = el("button"); b.type = "button";
    const parts = m.label.split(" "), ic = parts[0];
    b.append(el("span", "", ic), document.createTextNode(parts.slice(1).join(" ")));
    b.onclick = ()=>pick(m); g.appendChild(b); });
  return g;
}

/* ---------- login ---------- */
function showLogin(){ $("app").style.display = "none"; $("login").style.display = "flex"; }
$("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  $("loginErr").style.display = "none"; $("loginBtn").disabled = true;
  try{ await api("/parent/login", {phone:$("phone").value, pin:$("pin").value}); $("pin").value = ""; await start(); }
  catch(err){ $("loginErr").textContent = err.message; $("loginErr").style.display = "block"; }
  finally{ $("loginBtn").disabled = false; }
});

/* ---------- chat ---------- */
function drawKids(){
  const box = $("kids"); box.innerHTML = "";
  box.style.display = ME.children.length > 1 ? "flex" : "none";
  ME.children.forEach(k=>{
    const b = el("button", "kid" + (k.id === KID.id ? " on" : "")); b.type = "button";
    b.append(el("span", "av", (k.name || "?").trim().charAt(0).toUpperCase()), document.createTextNode(k.name + " "), el("small", "", k.course));
    b.onclick = ()=>{ KID = k; drawKids(); setMode("chat"); $("msgs").appendChild(el("div", "day", `${k.name} · ${k.course}`)); ask("menu", true); };
    box.appendChild(b);
  });
  $("topKid").textContent = `${KID.name} · ${KID.course} · ${KID.shift}`;
}
function pick(m){
  if(m.id === "issue"){ setMode("message"); bot([{t:"p", text:`Write your concern or message about ${KID.name} below and press ➤.`}]); $("text").focus(); return; }
  if(m.id === "receipt"){ openReceipt(); return; }
  setMode("chat"); ask(m.id);
}
function drawQuick(){
  const box = $("quick"); box.innerHTML = "";
  ME.menu.forEach(m=>{ const b = el("button", m.id === "receipt" ? "hl" : "", m.label); b.type = "button"; b.onclick = ()=>pick(m); box.appendChild(b); });
}
function setMode(m){
  MODE = m;
  $("mode").style.display = m === "message" ? "flex" : "none";
  $("modeKid").textContent = KID ? KID.name : "";
  $("text").placeholder = m === "message" ? "Write your message…" : "Type: attendance, test, fee…";
}
$("modeCancel").onclick = ()=> setMode("chat");

async function ask(text, silent){
  const label = (ME.menu.find(m=>m.id === text) || {}).label;
  if(!silent) say(label || text);
  typing(true);
  try{
    const r = await api("/parent/api/chat", {studentId:KID.id, text});
    typing(false);
    if(r.intent === "receipt"){ bot(r.blocks); openReceipt(); return; }
    bot(r.blocks, "", r.intent === "menu" ? tiles() : r.intent === "fee" ? rcButton() : null);
  }
  catch(err){ typing(false); if(err.message !== "login") bot([{t:"p", text:err.message}], "warn"); }
}
function rcButton(){ const b = el("button", "", "🧾 Paid the fee? Send the receipt"); b.type = "button";
  b.style.cssText = "margin-top:8px;width:100%;border:none;border-radius:10px;padding:9px;background:var(--green);color:#fff;font-weight:700";
  b.onclick = openReceipt; return b; }
$("compose").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const text = $("text").value.trim(); if(!text) return;
  $("text").value = ""; autoGrow();
  say(text);
  if(MODE === "message"){
    typing(true);
    try{ await api("/parent/api/message", {studentId:KID.id, text}); typing(false);
         bot([{t:"p", text:"✓ The school has received your message. The reply will appear under \"Teacher Remarks\"."}], "note"); setMode("chat"); }
    catch(err){ typing(false); if(err.message !== "login") bot([{t:"p", text:err.message}], "warn"); }
    return;
  }
  ask(text, true);
});
function autoGrow(){ const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(120, t.scrollHeight) + "px"; }
$("text").addEventListener("input", autoGrow);
$("text").addEventListener("keydown", (e)=>{ if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("compose").requestSubmit(); } });
$("attach").onclick = ()=>openReceipt();

/* ---------- fee receipt ---------- */
async function openReceipt(){
  if(!KID) return;
  RC = {file:"", preview:"", fees:[]};
  $("rcSub").textContent = `${KID.name} · ${KID.course} — send the receipt or bank / JazzCash screenshot of the fee you paid. The office will check it and mark the challan Paid.`;
  $("rcFees").innerHTML = "<p class='sub'>Loading challans…</p>";
  $("rcAmt").value = ""; $("rcDate").value = today(); $("rcRef").value = ""; $("rcMsg").textContent = ""; $("rcFile").value = "";
  resetDrop(); $("rcGo").disabled = false; $("rcPast").innerHTML = "";
  $("sheetBg").classList.add("show");
  try{
    const r = await api("/parent/api/challans?studentId=" + encodeURIComponent(KID.id));
    RC.fees = r.fees;
    const box = $("rcFees"); box.innerHTML = "";
    box.appendChild(el("label", "l", "Fee for challan"));
    const opts = [...r.fees.map(f=>({id:f.id, t:`${f.chNo} · ${fmtM(f.month)}`, s:f.dueDate ? `Due ${fmtD(f.dueDate)}` : "", amt:f.due})), {id:"", t:"Advance / other", s:"Challan not issued yet or not sure", amt:null}];
    opts.forEach((o, i)=>{
      const lab = el("label", "ch" + (i === 0 ? " on" : "")), rd = el("input"); rd.type = "radio"; rd.name = "rcFee"; rd.value = o.id; rd.checked = i === 0;
      const t = el("div"); t.append(el("b", "", o.t), el("small", "", o.s));
      lab.append(rd, t); if(o.amt !== null) lab.appendChild(el("span", "amt", money(o.amt)));
      rd.onchange = ()=>{ box.querySelectorAll(".ch").forEach(x=>x.classList.toggle("on", x.contains(rd))); if(o.amt) $("rcAmt").value = o.amt; };
      box.appendChild(lab);
    });
    if(opts[0].amt) $("rcAmt").value = opts[0].amt;
    if(r.receipts.length){
      const p = $("rcPast"); p.appendChild(el("b", "", "Previously sent receipts"));
      r.receipts.forEach(x=>{ const d = el("div"); d.append(el("span", "", `${fmtD(x.d)} · ${money(x.amount)}${x.chNo ? " · " + x.chNo : ""}`),
        el("span", x.status === "Approved" ? "st-a" : x.status === "Rejected" ? "st-r" : "st-p", x.status === "Approved" ? "✓ Recorded" : x.status === "Rejected" ? "✗ Returned" + (x.note ? ": " + x.note : "") : "⏳ Under review")); p.appendChild(d); });
    }
  }catch(err){ if(err.message !== "login") $("rcFees").innerHTML = ""; }
}
function closeReceipt(){ $("sheetBg").classList.remove("show"); }
$("rcClose").onclick = closeReceipt;
$("sheetBg").addEventListener("click", e=>{ if(e.target === $("sheetBg")) closeReceipt(); });
function resetDrop(){ const d = $("rcDrop"); d.innerHTML = ""; d.append(el("span", "", "📷"), el("b", "", "Take a photo or choose a file"), el("span", "", "JPG, PNG or PDF")); d.firstChild.style.fontSize = "1.8rem"; }
/* Tasveer chhoti kar ke bhejein (phone ki 4MB photo → ~300KB) */
function shrink(file){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{ const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .82)); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("This image could not be opened — choose another")); };
    img.src = url;
  });
}
$("rcFile").addEventListener("change", async ()=>{
  const f = $("rcFile").files[0]; if(!f) return;
  $("rcMsg").textContent = "";
  try{
    if(f.type === "application/pdf"){
      if(f.size > 5*1024*1024) throw new Error("PDF must be smaller than 5 MB");
      RC.file = await new Promise((res, rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(f); });
      RC.preview = ""; const d = $("rcDrop"); d.innerHTML = ""; d.append(el("span", "", "📄"), el("b", "", f.name), el("span", "", "Tap again to change"));
    } else {
      RC.file = await shrink(f); RC.preview = RC.file;
      const d = $("rcDrop"); d.innerHTML = ""; const i = el("img"); i.src = RC.file; i.alt = ""; d.append(i, el("span", "", "Tap again to change"));
    }
  }catch(err){ RC.file = ""; resetDrop(); $("rcMsg").textContent = err.message; }
});
$("rcGo").onclick = async ()=>{
  const sel = document.querySelector("input[name=rcFee]:checked"), feeId = sel ? sel.value : "";
  const amount = +$("rcAmt").value;
  if(!(amount > 0)){ $("rcMsg").textContent = "Enter the amount"; return; }
  if(!RC.file){ $("rcMsg").textContent = "Attach a receipt photo or PDF"; return; }
  $("rcGo").disabled = true; $("rcGo").textContent = "Sending…";
  try{
    await api("/parent/api/receipt", {studentId:KID.id, feeId, amount, paidOn:$("rcDate").value, method:$("rcMethod").value, ref:$("rcRef").value, file:RC.file});
    const f = RC.fees.find(x=>x.id === feeId);
    closeReceipt();
    say(`🧾 Fee receipt · ${money(amount)}${f ? ` · ${f.chNo} (${fmtM(f.month)})` : ""} · ${$("rcMethod").value}`, RC.preview);
    bot([{t:"h", text:"✓ Receipt received"}, {t:"p", text:"The school office will check it and mark the challan Paid. The status will appear under \"💳 Fee\"."}], "note");
  }catch(err){ if(err.message !== "login") $("rcMsg").textContent = err.message; }
  finally{ $("rcGo").disabled = false; $("rcGo").textContent = "Send receipt"; }
};

async function start(){
  ME = await api("/parent/api/me");
  $("login").style.display = "none"; $("app").style.display = "flex";
  $("msgs").innerHTML = "";
  if(!ME.children.length){
    bot([{t:"p", text:"No student found for this phone number. Please contact the school office."}], "warn");
    $("quick").innerHTML = ""; $("compose").style.display = "none"; return;
  }
  KID = ME.children[0];
  drawKids(); drawQuick(); setMode("chat");
  $("msgs").appendChild(el("div", "day", "Today"));
  bot([{t:"h", text:"Welcome! 👋"},
       {t:"p", text: ME.children.length > 1 ? `Your ${ME.children.length} children: ${ME.children.map(k=>k.name).join(", ")}. Choose a child above.` : `What would you like to see about ${KID.name} (${KID.course}, ${KID.shift})?`},
       ...(ME.replies ? [{t:"p", text:`The school has replied to ${ME.replies} of your message${ME.replies>1?"s":""} — tap "Teacher Remarks".`}] : [])], "", tiles());
}
start().catch(()=> showLogin());
</script>
