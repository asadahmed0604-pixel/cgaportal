name: EMS check
on:
  pull_request:
    paths: ["ems/**"]
  push:
    branches: [main]
    paths: ["ems/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node ems/check.js
