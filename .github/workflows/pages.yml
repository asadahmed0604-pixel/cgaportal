name: Deploy CGA EMS to GitHub Pages

# Main hosting Render par hai (render.yaml). GitHub Pages sirf backup ke taur par:
# Settings → Pages → Source: "GitHub Actions" karke Actions tab se hath se chalayein.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ems
      - id: deployment
        uses: actions/deploy-pages@v4
